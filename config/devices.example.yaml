# Gateway configuration.
#
# A TC500A reports device_id 4194302 until one is assigned on the touchscreen
# (Config > Connection > Wi-Fi > BACnet IP > Device ID). Every unconfigured unit
# reports that same number, so set it before adding a second thermostat or the
# two will collide.
#
# Convention: device_id == room number, and the last octet of the reserved DHCP
# address matches too, so 192.168.1.101 is device 301 in room 301.

bacnet:
  # Pin the interface explicitly. A gateway with more than one NIC -- the office
  # LAN plus a second adapter on the thermostat subnet, which is the arrangement
  # here -- otherwise binds whichever bacpypes3 picks, and BACnet/IP broadcasts
  # go out the wrong one. Set this to the gateway's own address on the
  # thermostats' subnet, with its prefix length.
  address: 192.168.1.10/24
  device_id: 4000000
  name: bms-gateway
  # foreign_bbmd: 192.168.0.1:47808   # only if the gateway is off the thermostats' subnet

# Budget this from measured round-trips, not from the RPM read time. Measured
# against 16 real thermostats on building Wi-Fi: ~640 ms per device, so a cycle
# is ~10 s for 16 and ~16 s for 25. The 19 ms figure this project once quoted was
# a wired bench measurement of the read alone and is 33x optimistic; it is what
# made a 10-second interval look safe when it was not.
#
# Too low does not crash anything -- the loop sleeps for whatever is left of the
# interval, never less than zero -- but it saturates: the cycle ends and the next
# begins immediately, logging "poll cycle took Ns, longer than the Ns interval"
# every time, with no headroom for the ~5 s a non-answering device costs. That
# warning is the signal to raise this number.
#
# 30 suits ~16-25 devices over Wi-Fi. Note staleness is 3x this, so a dead device
# is flagged after 90 s; commands do not wait for the next cycle, they re-read
# immediately.
poll_interval_seconds: 30
# BACnet/IP is UDP, and confirmed services carry their own retry: the device
# object's apduTimeout (3000 ms) and numberOfApduRetries (3) mean a request is
# transmitted up to four times over about twelve seconds before the stack gives
# up. This setting is an OUTER timeout wrapped around all of that.
#
# At 5 it truncates the retry cycle. Measured against a dark address: 5 gives up
# at 5.00 s with our own TimeoutError, part-way through the second attempt, while
# 15 lets bacpypes3 run all four and abort at 12.01 s with BACnet's own
# no-response. So attempts three and four -- the ones most likely to get through
# on a lossy link -- currently never happen.
#
# Raising this alone is the wrong fix: a genuinely dead device would then block
# the sequential poll loop for twelve seconds instead of five. If retries matter
# on your Wi-Fi, shorten each attempt rather than lengthening the wait -- these
# thermostats answer in ~640 ms, so 3 s per attempt is generous. Four attempts at
# 1.5 s fits inside a 7 s outer timeout and retransmits sooner, which is what a
# lossy link actually wants.
#
# Note this changes what a "failure" means: today it means one-and-a-bit
# attempts, afterwards it means four. Do not compare drop-out counts across the
# change.
request_timeout_seconds: 5

# Loopback only. This host has a public static IP; the web app must never be
# reachable on it. Remote access goes over Tailscale/WireGuard.
api_host: 127.0.0.1
# Deliberately not 8080 -- that collides with the hermfischer-xb workspace.
api_port: 8237

# Set all three together, once a tunnel or reverse proxy terminates TLS in front:
#   secure_cookies: true          # AFTER https works, never before
#   behind_proxy: true            # only then is the client-IP header believed
#   client_ip_header: cf-connecting-ip   # or x-forwarded-for for Caddy/nginx
# The exact https origin users reach this on. Required for passkeys (Face ID /
# fingerprint confirmation on door unlock): WebAuthn binds credentials to the
# origin, so a mismatch -- http instead of https, a trailing slash, a different
# hostname -- makes every passkey fail. Empty disables passkeys, which is the
# correct behaviour on plain http since browsers refuse the API outside a secure
# context.
public_origin: "https://controls.16400ventura.com"

secure_cookies: false
behind_proxy: false

# One thermostat carries a physical outdoor sensor (Sylk or a UI terminal); the
# gateway shares its reading to all the others. The thermostats cannot exchange
# it themselves -- no COV, and they never originate reads -- so this is the only
# way, and it needs no thermostat-to-thermostat network access.
# Leave null until a sensor is fitted; sharing the 65535 "no value" sentinel
# would set a nonsense outdoor temperature on every other unit.
outdoor_sensor_device_id: null

# Fallback when no physical sensor is fitted, or when it fails. Selecting
# BACnet/IP disables the thermostat's own internet path and an isolated VLAN
# removes it entirely, so its built-in zip-code lookup is unavailable -- but the
# gateway has internet and can supply the same value. Open-Meteo needs no API key.
outdoor_weather:
  enabled: true
  zip_code: "91436"

devices:
  - device_id: 301
    address: 192.168.1.101
    name: Room 301
    zone: floor-3
    # Wi-Fi MAC, for the DHCP reservation on the router.
    mac: 00:11:22:33:44:55

  # The simulator, for offline work:
  #   .venv/bin/python tools/sim_tc500a.py --address 192.168.1.10:47809 --instance 2001
  # - device_id: 2001
  #   address: 192.168.1.10:47809
  #   name: Simulated zone
  #   zone: lab

# Interlogix TruPortal access panel, if one is fitted. Doors and lighting relays.
# Credentials sit in this file, so keep it readable only by the service account:
#   chmod 600 config/devices.yaml
truportal:
  enabled: false
  host: 192.168.1.50
  username: bms-service
  password: "change-me"
  doors:
    # zones: ["*"] means any tenant may open it -- right for a shared entrance,
    # wrong for a door into one suite. An empty list means no tenant may, which
    # still leaves it available to managers and admins.
    - {id: 21, name: "Front entrance", zones: ["*"]}
  # Check what these contactors actually switch before exposing one to tenants.
  # At 16400 Ventura the corridor's corner and mid-span lamps are on a separate
  # always-on circuit, so switching a trigger off leaves the floor dim rather
  # than dark. A trigger that can darken an egress path does not belong on the
  # tenant page.
  lighting_triggers:
    # role is mapped explicitly rather than inferred from the action's name, so
    # renaming an action on the panel cannot hand tenants a long-duration one.
    - {id: 6,  zone: floor-2, role: tenant}
    - {id: 12, zone: "*",     role: manager}
